services:
  palflow:
    build: .
    restart: unless-stopped
    # Internal only — no public ports

  edge:
    build: ./edge
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PALFLOW_DOMAIN=${PALFLOW_DOMAIN}
      - TLS_MODE=${TLS_MODE:-auto}
      - ALLOW_SELF_SIGNED=${ALLOW_SELF_SIGNED:-0}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/cloudflare:/etc/nginx/cf_certs:ro
      - ./acme-webroot:/var/www/certbot
    depends_on:
      - palflow
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $(cat /run/nginx.pid 2>/dev/null) 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/cloudflare:/etc/nginx/cf_certs:ro
      - ./acme-webroot:/var/www/certbot
      - ./certbot/renew.sh:/opt/renew.sh:ro
    environment:
      - TLS_MODE=${TLS_MODE:-auto}
      - PALFLOW_DOMAIN=${PALFLOW_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    entrypoint: ["/bin/sh", "/opt/renew.sh"]
    depends_on:
      edge:
        condition: service_healthy
    restart: on-failure
