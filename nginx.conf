server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — single-file app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Icon assets — long cache, immutable content
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
